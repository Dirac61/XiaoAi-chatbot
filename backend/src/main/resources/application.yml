server:
  port: 8080

spring:
  application:
    name: xiaoi-backend
  profiles:
    active: local
  
  mvc:
    async:
      request-timeout: 300000
  
  datasource:
    url: jdbc:mysql://localhost:3306/xiaoai?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  redis:
    host: localhost
    port: 6379
    timeout: 10000ms
    database: 0

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

agent:
  url: http://localhost:8000

internal:
  secret: ${INTERNAL_SECRET:xiaoi-internal-api-secret-2026}

aliyun:
  oss:
    endpoint: oss-cn-beijing.aliyuncs.com
    bucket-name: ${ALIYUN_OSS_BUCKET:your-bucket-name}
    access-key-id: ${ALIYUN_OSS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_SECRET:}
  asr:
    access-key-id: ${ALIYUN_ASR_KEY_ID:}
    access-key-secret: ${ALIYUN_ASR_SECRET:}
    app-key: ${ALIYUN_ASR_APP_KEY:}
