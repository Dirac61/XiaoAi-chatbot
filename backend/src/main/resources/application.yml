server:
  port: 8080

spring:
  application:
    name: xiaoi-backend
  
  mvc:
    async:
      request-timeout: 300000
  
  datasource:
    url: jdbc:mysql://localhost:3306/xiaoai?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  redis:
    host: localhost
    port: 6379
    timeout: 10000ms
    database: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

agent:
  url: http://localhost:8000
